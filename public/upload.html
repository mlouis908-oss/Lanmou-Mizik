<!DOCTYPE html>
<html lang="ht">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lanmou Mizik - Téléverser une chanson</title>
  <style>
    body {
      background-color: #0d0d0d;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .form-card {
      background-color: #1a1a1a;
      border: 2px solid #e50914;
      border-radius: 12px;
      padding: 30px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 4px 15px rgba(229, 9, 20, 0.3);
    }
    h2 {
      color: #e50914;
      text-align: center;
      margin-bottom: 25px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }
    input[type="text"], select, input[type="file"] {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #333;
      background-color: #2b2b2b;
      color: #fff;
      box-sizing: border-box;
    }
    .btn-submit {
      width: 100%;
      background-color: #e50914;
      color: #fff;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn-submit:hover {
      background-color: #b80710;
    }
    a {
      color: #888;
      text-decoration: none;
      display: block;
      text-align: center;
      margin-top: 15px;
    }
    a:hover {
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="form-card">
    <h2>Lanmou Mizik - Upload</h2>
    <form action="/upload" method="POST" enctype="multipart/form-data">
      
      <div class="form-group">
        <label for="title">Tit Mizik la:</label>
        <input type="text" id="title" name="title" placeholder="Mete tit mizik la" required>
      </div>

      <div class="form-group">
        <label for="artist">Non Atis la:</label>
        <input type="text" id="artist" name="artist" placeholder="Non atis la" required>
      </div>

      <div class="form-group">
        <label for="genre">Style Mizik (Genre):</label>
        <select id="genre" name="genre">
          <option value="rap">Rap / Hip-Hop</option>
          <option value="drill">Drill</option>
          <option value="rnb">R&B</option>
          <option value="kompa">Kompa</option>
          <option value="other">Lòt</option>
        </select>
      </div>

      <div class="form-group">
        <label for="cover">Kouvèti (Cover Art):</label>
        <input type="file" id="cover" name="cover" accept="image/*" required>
      </div>

      <div class="form-group">
        <label for="audio">Fichye Mizik (MP3/WAV):</label>
        <input type="file" id="audio" name="audio" accept="audio/*" required>
      </div>

      <button type="submit" class="btn-submit">Voye Mizik la</button>
    </form>

    <a href="/">← Tounen sou paj prensipal la</a>
  </div>

</body>
</html>
